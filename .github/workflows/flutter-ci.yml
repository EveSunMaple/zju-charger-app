name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  android:
    needs: [flutter, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      JPUSH_APP_KEY: ${{ vars.JPUSH_APP_KEY }}
      DEBUG_PUSH_TOKEN: ${{ vars.DEBUG_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=JPUSH_APP_KEY="$JPUSH_APP_KEY" \
            --dart-define=DEBUG_PUSH_TOKEN="$DEBUG_PUSH_TOKEN"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=JPUSH_APP_KEY="$JPUSH_APP_KEY" \
            --dart-define=DEBUG_PUSH_TOKEN="$DEBUG_PUSH_TOKEN"

      - name: Checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk app-release.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: zju-charger-android-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo "## Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Debug APK: \`app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release APK: \`app-release.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`zju-charger-android-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在该 Actions run 的 Artifacts 下载并安装。未配置 \`API_BASE_URL\` 时使用离线快照；未配置 \`JPUSH_APP_KEY\` 时推送关闭。" >> "$GITHUB_STEP_SUMMARY"
