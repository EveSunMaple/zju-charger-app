services:
  api:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    volumes:
      - ../backend/data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
